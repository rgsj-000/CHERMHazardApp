name: Bootstrap CHERM Hazard App

on:
  push:
    branches:
      - feature/offline-hazard-simulator
    paths:
      - .github/workflows/bootstrap-project.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore verified project snapshot
        shell: bash
        run: |
          cat .bootstrap/project.b64.* > /tmp/project.b64
          base64 --decode /tmp/project.b64 > /tmp/project.tgz
          tar -xzf /tmp/project.tgz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml
          rm -f .github/workflows/vendor-assets.yml

      - name: Vendor offline runtime assets
        shell: bash
        run: |
          npm install --ignore-scripts
          npm run vendor

      - name: Verify implementation
        shell: bash
        run: |
          node --check js/app.js
          node --check js/hazard-model.js
          node --check js/random-forest.js
          npm test

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement offline climate hazard simulator'
          git push
